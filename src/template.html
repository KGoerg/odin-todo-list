<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-do List</title>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>My Projects</h1>
            <button command="show-modal" id="add-new-project" commandfor="new-dialog">New Project</button>
        </div>
        <div class="dialog">
            <dialog id="new-dialog" closedby="any">
                <p>Add project details below:</p>
                <form action="" method="dialog">
                    <label for="project_name">Project Name</label>
                    <input type="text" id="project_name" name="project_name" required>

                    <label for="project_description">Project Description:</label>
                    <input type="text" id="project_description" name="project_description">

                    <button type="submit">Submit</button>
                </form>
            </dialog>
        </div>

        <div class="dialog">
            <dialog id="edit-project" closedby="any">
               <p>Edit project details below:</p>
               <form action="" method="dialog">
                    <label for="new_project_name">Project Name</label>
                    <input type="text" id="new_project_name" name="new_project_name" required>

                    <label for="new_project_description">Project Description:</label>
                    <input type="text" id="new_project_description" name="new_project_description">

                    <button type="submit" id="edit-submit">Submit</button>
                </form>
            </dialog>
        </div>
        <div class="projects-container"></div>
    </div>

    <div id="content">
        <div class="todos-container"></div>
    </div>
</body>
</html>
